# 시드 생성 전용. 측정용이 아니다.
# 측정용 compose와 postgresql.bench.conf는 bench-infra(유진) 소관이다.
name: hjo-seed

services:
  postgres:
    image: postgres:18.6-bookworm      # Testcontainers와 같은 태그. latest 금지
    environment:
      POSTGRES_USER: ${PGUSER:-hjo}
      POSTGRES_PASSWORD: ${PGPASSWORD:-hjo}
      POSTGRES_DB: postgres            # 관리용 DB. 시드가 여기 붙어 seed_*/bench를 만든다
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "max_wal_size=4GB"]
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - seed-pgdata:/var/lib/postgresql
      - ./:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-hjo} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 앱과 같은 마이그레이션 파일을 같은 버전 Flyway로 적용한다.
  # flyway_schema_history를 Flyway가 직접 채우므로 앱이 나중에 재적용하지 않는다.
  flyway:
    image: flyway/flyway:11.7.2-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../src/main/resources/db/migration:/flyway/sql/migration:ro
    entrypoint: ["flyway"]
    command: ["-url=jdbc:postgresql://postgres:5432/${SEED_DB:-seed_build}",
              "-user=${PGUSER:-hjo}", "-password=${PGPASSWORD:-hjo}",
              "-locations=filesystem:/flyway/sql/migration",
              "-connectRetries=10", "migrate"]

volumes:
  seed-pgdata:
